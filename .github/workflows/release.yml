name: Release

# Push a tag such as v0.2.0 to build the installer and the signed APK and publish them as a
# GitHub Release. The APK is signed with the key from the repository secrets
# ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD
# (see README, Development).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Tests
        run: |
          go test ./...
          if ($LASTEXITCODE) { exit 1 }

      - name: Inno Setup
        run: choco install innosetup -y --no-progress

      - name: gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile golang.org/x/mobile/cmd/gobind
          if ($LASTEXITCODE) { exit 1 }
          "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Release key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if (-not $env:ANDROID_KEYSTORE_BASE64) { throw 'The ANDROID_KEYSTORE_BASE64 secret is not set.' }
          $jks = Join-Path $env:RUNNER_TEMP 'release.jks'
          [IO.File]::WriteAllBytes($jks, [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
          "ANDROID_KEYSTORE_FILE=$jks" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build installer and APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          ./tools/build-release.ps1 -Version $version

      - name: Remove the release key
        if: always()
        run: Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $env:RUNNER_TEMP 'release.jks')

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Smart Tether ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            build/release/SmartTether-Setup.exe
            build/release/SmartTether.apk
